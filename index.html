<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Servidor Minecraft</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #eaeaea;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
    }

    h1 {
      font-size: 60px;
      margin-top: 100px;
      letter-spacing: 2px;
    }

    p {
      color: #888;
    }

    .btn {
      margin-top: 30px;
      padding: 15px 30px;
      border: 1px solid #00ffae;
      background: transparent;
      color: #00ffae;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00ffae;
      color: black;
    }
  </style>
</head>

<body>
  <h1>Tu Servidor</h1>
  <p>El mejor servidor de Minecraft</p>

  <button class="btn">JUGAR AHORAAAAAAAAAAAAAAA</button>
</body>
</html>
